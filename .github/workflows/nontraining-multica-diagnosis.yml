name: Non-training MultiCA diagnosis

on:
  pull_request:
    paths:
      - "customized_areal/tree_search/**"
      - ".github/workflows/nontraining-multica-diagnosis.yml"

jobs:
  diagnosis-contract:
    name: Diagnosis client and DAG contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install targeted test dependencies
        run: python -m pip install aiohttp colorlog pytest httpx
      - name: Test diagnosis route, turn coverage, and node reward normalization
        run: >-
          python -m pytest -q
          customized_areal/tree_search/tests/test_env_dispatch_client.py
          customized_areal/tree_search/tests/test_multica_dag_client.py
          customized_areal/tree_search/tests/test_multica_node_rewards.py
